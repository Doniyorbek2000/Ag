name: adm_ai
description: ADM AI - Professional Android AI Agent

publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter

  # AI & API
  anthropic_sdk_dart: ^0.9.0
  http: ^1.2.2
  dio: ^5.7.0

  # Voice & Speech
  speech_to_text: ^7.0.0
  flutter_tts: ^4.2.1
  record: ^5.1.2
  just_audio: ^0.9.42

  # State Management
  provider: ^6.1.2
  riverpod: ^2.6.1
  flutter_riverpod: ^2.6.1

  # Storage
  shared_preferences: ^2.3.3
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  sqflite: ^2.3.3+1
  path_provider: ^2.1.5

  # Permissions & Device
  permission_handler: ^11.3.1
  url_launcher: ^6.3.1
  android_intent_plus: ^4.0.3
  flutter_phone_direct_caller: ^2.1.1
  contacts_service: ^0.6.3

  # UI Components
  flutter_animate: ^4.5.0
  lottie: ^3.1.3
  shimmer: ^3.0.0
  cached_network_image: ^3.4.1
  flutter_svg: ^2.0.10+1
  glassmorphism: ^3.0.0
  animated_text_kit: ^4.2.3
  fl_chart: ^0.69.0

  # Navigation
  go_router: ^14.6.2

  # Notifications
  flutter_local_notifications: ^17.2.4
  firebase_messaging: ^15.1.6
  firebase_core: ^3.8.0

  # In-App Purchase / Subscription
  in_app_purchase: ^3.2.0
  purchases_flutter: ^8.1.4

  # Background Service
  flutter_background_service: ^5.0.5

  # Connectivity
  connectivity_plus: ^6.1.1

  # Crypto & Security
  encrypt: ^5.0.3
  local_auth: ^2.3.0

  # Utils
  intl: ^0.20.1
  uuid: ^4.5.1
  collection: ^1.18.0
  equatable: ^2.0.7
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0
  logger: ^2.5.0
  package_info_plus: ^8.1.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.14
  freezed: ^2.5.7
  json_serializable: ^6.9.0
  hive_generator: ^2.0.1

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/animations/
    - assets/audio/

  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
        - asset: assets/fonts/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
